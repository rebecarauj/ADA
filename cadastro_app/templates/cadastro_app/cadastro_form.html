{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Interesse</title>
    <style>
        /* Seus estilos gerais e do formulário (que você já tem) */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #eeeef8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1em;
            color: #333;
            transition: border-color 0.3s ease;
            appearance: none; /* remove setinha padrão (opcional) */
            background-color: #fff;
        }

        select:focus {
            border-color: #6a0dad;
            outline: none;
            box-shadow: 0 0 0 3px rgba(123, 62, 188, 0.2);
        }


        .container {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #6a0dad;
            margin-bottom: 30px;
            font-size: 2em;
            font-weight: 600;
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; font-size: 0.95em; }
        input[type="text"], input[type="email"] { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1em; color: #333; transition: border-color 0.3s ease; }
        input[type="text"]:focus, input[type="email"]:focus { border-color: #6a0dad; outline: none; box-shadow: 0 0 0 3px rgba(123, 62, 188, 0.2); }

        .messages { list-style: none; padding: 0; margin-bottom: 20px; }
        .messages li { padding: 12px; margin-bottom: 10px; border-radius: 8px; font-weight: 500; text-align: left; }
        .messages .success { background-color: #e6ffed; color: #28a745; border: 1px solid #c8e6c9; }
        .errorlist { color: #dc3545; font-size: 0.85em; margin-top: 5px; text-align: left; }

        .button-style {
            display: block; /* Essencial para que width: 100% funcione */
            margin-top: 10px; /* Mais espaço do texto para o botão */
            background-color: #6a0dad; /* Roxo principal, igual ao botão de submit */
            color: white;
            padding: 10px 15px; /* Mesmo padding */
            border: none;
            border-radius: 4px; /* Mesma borda */
            text-decoration: none; /* Remove sublinhado padrão de link */
            font-size: 1em; /* Mesmo tamanho de fonte */
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%; /* Ocupa 100% da largura do container */
            box-sizing: border-box; /* Inclui padding na largura total */
            text-align: center; /* Centraliza o texto do botão */
        }

        .button-style:hover {
            background-color: #8a2be2; /* Roxo mais escuro no hover */
            transform: translateY(-2px); /* Efeito de elevação */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>REGISTRO DE INTERESSE<br>NO CURSO</h1>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    {% if field.help_text %}
                        <small style="color: #666; display: block; margin-top: 5px;">{{ field.help_text }}</small>
                    {% endif %}
                    {% for error in field.errors %}
                        <p class="errorlist">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="button-style">Registrar Interesse</button>
        </form>

        <a href="{% url 'chatbot_app:chatbot_view' %}" class="button-style">
            Voltar ao Site
        </a>
        </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#id_cpf').mask('000.000.000-00');
            $('#id_whatsapp').mask('(00) 00000-0000');
        });
    </script>
</body>
</html>
